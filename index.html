<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>think</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tabs-container" id="tabs-container">
      <div class="tab active" id="tab-1" data-tab-id="1">
        <div class="tab-content">
          <div class="tab-favicon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
          </div>
          <div class="tab-title">New Tab</div>
          <button class="tab-close" title="Close tab">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <button class="new-tab-btn" id="new-tab-btn" title="New tab">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-btn" id="back-btn" title="Go Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button class="nav-btn" id="forward-btn" title="Go Forward">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button class="nav-btn refresh-btn" id="refresh-btn" title="Reload this page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
      </button>
    </div>

    <div class="nav-center">
      <div class="address-bar">
        <input type="text" id="url-input" placeholder="Search Google or type a URL" autocomplete="off">
        <button class="address-btn" id="go-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
        </button>
      </div>
    </div>

    <div class="nav-right">

      <button class="nav-btn tab-stack-btn" id="tab-stack-btn" title="Show all tabs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </button>
      <button class="nav-btn profile-btn" id="profile-btn" title="Profile">
        <div class="profile-avatar">
          <img
            src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iIzNiODJmNiIvPgogIDxjaXJjbGUgY3g9IjE2IiBjeT0iMTIiIHI9IjQiIGZpbGw9IndoaXRlIi8+CiAgPHBhdGggZD0iTTggMjZhOCA4IDAgMCAxIDE2IDBaIiBmaWxsPSJ3aGl0ZSIvPgo8L3N2Zz4K"
            alt="Profile" />
        </div>
      </button>
      <button class="nav-btn ai-assistant-btn" id="ai-btn" title="AI Assistant">
        <img src="assets/icons/aiassistant.svg" alt="AI Assistant" class="ai-icon" />
      </button>
      <button class="nav-btn" id="menu-btn" title="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Tab Stack Overview -->
  <div class="tab-stack-overlay" id="tab-stack-overlay" style="display: none;">
    <div class="tab-stack-header">
      <h2>All Tabs</h2>
      <button class="tab-stack-close" id="tab-stack-close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="tab-stack-grid" id="tab-stack-grid">
      <!-- Tab previews will be dynamically added here -->
    </div>
    <div class="tab-stack-actions">
      <button class="tab-stack-action-btn" id="new-tab-from-stack">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        New Tab
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Welcome/Start Page -->
    <div class="start-page" id="start-page">
      <div class="logo-container">
        <h1 class="logo">think</h1>
      </div>

      <div class="search-container">
        <div class="search-box" id="search-box">
          <div class="file-preview-area" id="file-preview-area" style="display: none;">
            <div class="uploaded-files" id="uploaded-files"></div>
          </div>
          <div class="search-input-row">
            <input type="text" id="main-search" placeholder="Ask Anything" autocomplete="off">
            <div class="search-buttons">
              <button class="search-btn" id="search-btn" title="Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
              </button>
              <button class="search-btn file-upload-btn" id="file-upload-btn" title="Upload files">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                  <polyline points="14,2 14,8 20,8" />
                  <path d="M12 18v-6" />
                  <path d="m9 15 3-3 3 3" />
                </svg>
                <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
                  style="display: none;">
              </button>
              <button class="search-btn" id="ai-search-btn" title="AI Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2L2 7l10 5 10-5-10-5z" />
                  <path d="M2 17l10 5 10-5" />
                  <path d="M2 12l10 5 10-5" />
                </svg>
              </button>
              <button class="search-btn voice-btn" id="voice-btn" title="Voice Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                  <line x1="12" y1="19" x2="12" y2="23" />
                  <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
              </button>
              <button class="search-btn research-btn" id="research-btn" title="Research">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14,2 14,8 20,8" />
                  <line x1="16" y1="13" x2="8" y2="13" />
                  <line x1="16" y1="17" x2="8" y2="17" />
                  <polyline points="10,9 9,9 8,9" />
                </svg>
              </button>
              <button class="search-btn" id="submit-btn" title="Submit">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22,2 15,22 11,13 2,9 22,2" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="customize-container">
        <button class="customize-btn" id="customize-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1" />
          </svg>
          Customize
        </button>
      </div>
    </div>

    <!-- Browser Content Area -->
    <div class="browser-content" id="browser-content" style="display: none;">
      <div class="webview-container" id="webview-container">
        <webview id="webview-1" data-tab-id="1" src="about:blank" style="width: 100%; height: 100%; border: none;">
        </webview>
      </div>
    </div>

    <!-- AI Chat Panel -->
    <div class="ai-panel" id="ai-panel" style="display: none;">
      <div class="ai-header">
        <div class="ai-logo">
          <img src="assets/icons/aiassistant.svg" alt="AI Assistant" width="20" height="20" />
        </div>
        <button class="ai-close-btn" id="close-ai-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="ai-content">
        <div class="ai-title">Assistant</div>

        <div class="ai-messages" id="ai-messages">
          <!-- Messages will be added here dynamically -->
        </div>

        <div class="ai-input-section">
          <div class="ai-input-wrapper">
            <div class="ai-input-container">
              <div class="ai-input-icon">
                <img src="assets/icons/aiassistant.svg" alt="AI" width="16" height="16" style="opacity: 0.6;" />
              </div>
              <input type="text" id="ai-input" placeholder="Ask Anything" autocomplete="off">
              <div class="ai-input-actions">
                <button class="ai-action-btn" id="ai-attach-btn" title="Attach file">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                      d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                  </svg>
                </button>
                <button class="ai-action-btn" id="ai-voice-btn" title="Voice input">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                  </svg>
                </button>
                <button class="ai-send-btn" id="ai-send-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13" />
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="ai-footer">
            <div class="ai-branding">
              <img src="assets/icons/aiassistant.svg" alt="AI" width="12" height="12" style="opacity: 0.6;" />
              <span>Prabony AI</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>

</html>
